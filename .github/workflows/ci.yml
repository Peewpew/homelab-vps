name: CI Pipeline

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate docker-compose files
        run: docker-compose -f immich/docker-compose.yml config

      - name: Lint bash scripts
        run: |
          find scripts/ -name "*.sh" -exec bash -n {} \;
